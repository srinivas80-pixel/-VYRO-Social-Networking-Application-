{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;position:relative}
        body::before{content:'';position:fixed;inset:0;background:url("{% static 'images/register-bg.jpeg' %}") center/cover no-repeat;z-index:-2}
        body::after{content:'';position:fixed;inset:0;background:rgba(10,14,26,0.75);z-index:-1}
        .auth-box{width:100%;max-width:440px;padding:32px}
        .logo{width:48px;height:48px;border-radius:50%;overflow:hidden;margin:0 auto 24px;box-shadow:0 0 30px rgba(59,130,246,.3)}
        .logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        h1{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}
        .subtitle{color:#64748b;text-align:center;margin-bottom:32px;font-size:15px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;color:#64748b;font-size:13px;margin-bottom:6px}
        .form-group input{width:100%;padding:14px 16px;background:#0f1525;border:1px solid #1e293b;border-radius:8px;color:#f1f5f9;font-size:16px;outline:none;transition:border .2s}
        .form-group input:focus{border-color:#3b82f6}
        .auth-btn{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 0 20px rgba(59,130,246,.25)}
        .auth-btn:hover{background:#2563eb;box-shadow:0 0 30px rgba(59,130,246,.4)}
        .auth-links{margin-top:20px;text-align:center;font-size:15px;color:#64748b}
        .auth-links a{color:#3b82f6}
        .error-list{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px 16px;margin-bottom:20px;color:#ef4444;font-size:14px;list-style:none}
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="logo"><img src="{% static 'images/vyro-logo.jpeg' %}" alt="VYRO"></div>
        <h1>Find your account</h1>
        <p class="subtitle">Enter the email associated with your VYRO account.</p>
        {% if messages %}
        <ul class="error-list">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required autofocus>
            </div>
            <button type="submit" class="auth-btn">Search</button>
        </form>
        <div class="auth-links">
            <a href="{% url 'login' %}">Back to login</a>
        </div>
    </div>
</body>
</html>
