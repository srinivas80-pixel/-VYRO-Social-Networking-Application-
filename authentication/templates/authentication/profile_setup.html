{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO - Set Up Your Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;position:relative}
        body::before{content:'';position:fixed;inset:0;background:url("{% static 'images/register-bg.jpeg' %}") center/cover no-repeat;z-index:-2}
        body::after{content:'';position:fixed;inset:0;background:rgba(10,14,26,0.75);z-index:-1}
        .setup-container{width:100%;max-width:520px;padding:32px}
        .logo{width:48px;height:48px;border-radius:50%;overflow:hidden;margin:0 auto 24px;box-shadow:0 0 30px rgba(59,130,246,.3)}
        .logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        h1{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}
        .subtitle{color:#64748b;text-align:center;margin-bottom:32px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;color:#64748b;font-size:13px;margin-bottom:6px}
        .form-group input,.form-group textarea{width:100%;padding:14px 16px;background:#0f1525;border:1px solid #1e293b;border-radius:8px;color:#f1f5f9;font-size:16px;outline:none;transition:border .2s;font-family:inherit}
        .form-group input:focus,.form-group textarea:focus{border-color:#3b82f6}
        .form-group textarea{resize:vertical;min-height:80px}
        .form-group input[type="file"]{padding:10px}
        .interests-section h3{font-size:18px;margin-bottom:12px}
        .interests-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
        .interest-item{text-align:center;padding:12px 8px;background:#0f1525;border:2px solid #1e293b;border-radius:12px;cursor:pointer;transition:all .2s;font-size:14px}
        .interest-item:hover{border-color:#3b82f6}
        .interest-item.selected{border-color:#3b82f6;background:rgba(59,130,246,.1)}
        .interest-item input{display:none}
        .auth-btn{width:100%;padding:14px;background:#3b82f6;color:#fff;border:none;border-radius:30px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;box-shadow:0 0 20px rgba(59,130,246,.25)}
        .auth-btn:hover{background:#2563eb;box-shadow:0 0 30px rgba(59,130,246,.4)}
        .skip-link{display:block;text-align:center;color:#64748b;margin-top:16px;font-size:15px}
        .skip-link:hover{color:#f1f5f9}
        @media(max-width:500px){.interests-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo"><img src="{% static 'images/vyro-logo.jpeg' %}" alt="VYRO"></div>
        <h1>Set up your profile</h1>
        <p class="subtitle">This helps people find and get to know you on VYRO.</p>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>Display Name</label>
                <input type="text" name="display_name" placeholder="Your display name" value="{{ form.display_name.value|default:'' }}">
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio" placeholder="Tell us about yourself" rows="3">{{ form.bio.value|default:'' }}</textarea>
            </div>
            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" name="profile_picture" accept="image/*">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" name="location" placeholder="Where are you based?" value="{{ form.location.value|default:'' }}">
            </div>
            <div class="interests-section">
                <h3>What are you interested in?</h3>
                <div class="interests-grid">
                    {% for value, label in interests_choices %}
                    <label class="interest-item" onclick="this.classList.toggle('selected')">
                        <input type="checkbox" name="interests" value="{{ value }}">
                        {{ label }}
                    </label>
                    {% empty %}
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="technology">Technology</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="sports">Sports</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="music">Music</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="gaming">Gaming</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="news">News</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="entertainment">Entertainment</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="science">Science</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="fashion">Fashion</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="art">Art</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="food">Food</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="travel">Travel</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="fitness">Fitness</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="photography">Photography</label>
                    <label class="interest-item" onclick="this.classList.toggle('selected')"><input type="checkbox" name="interests" value="business">Business</label>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="auth-btn">Continue to VYRO</button>
        </form>
        <a href="{% url 'home' %}" class="skip-link">Skip for now</a>
    </div>
</body>
</html>
