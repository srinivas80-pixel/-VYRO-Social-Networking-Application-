{% extends 'base.html' %}
{% block title %}Create Post - VYRO{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-row">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
        </button>
        <h1>Create Post</h1>
    </div>
</div>

<div class="compose-box" style="border:none;">
    <div class="compose-avatar">
        {% if user.profile_picture %}
            <img src="{{ user.profile_picture.url }}" alt="">
        {% else %}
            <div class="avatar-placeholder">{{ user.username.0|upper }}</div>
        {% endif %}
    </div>
    <form class="compose-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <textarea name="content" id="createPostText" placeholder="What's happening?" maxlength="500" style="min-height:120px;font-size:20px;" autofocus></textarea>
        <div class="compose-preview" id="composePreview"></div>
        <div class="compose-toolbar">
            <div class="compose-tools">
                <label title="Image">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"/></svg>
                    <input type="file" name="image" accept="image/*" id="composeImage" onchange="previewMedia(this,'image')">
                </label>
                <label title="Video">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 2.5c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h7v2H7v2h10v-2h-3.5v-2h7c1.1 0 2-.9 2-2v-11c0-1.1-.9-2-2-2h-17zm0 2h17v11h-17v-11zm6.5 2v7l6-3.5-6-3.5z"/></svg>
                    <input type="file" name="video" accept="video/*" id="composeVideo" onchange="previewMedia(this,'video')">
                </label>
                <label title="Hashtag" style="cursor:pointer;" onclick="insertHashtag('createPostText')">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px;"><path d="M10.09 3.098L9.72 7h5.99l.39-4.089 1.99.178L17.72 7H21v2h-3.47l-.48 5H21v2h-4.14l-.39 4.089-1.99-.178L14.85 16h-5.99l-.39 4.089-1.99-.178L6.85 16H3v-2h4.04l.48-5H3V7h4.71l.39-4.089 1.99.178zM14.66 14l.48-5H9.15l-.48 5h5.99z"/></svg>
                </label>
                <div id="createPostEmojiPicker"></div>
            </div>
            <div style="display:flex;align-items:center;">
                <span class="char-count" id="charCount"></span>
                <button type="submit" class="compose-submit">Post</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
var textarea = document.getElementById('createPostText');
var charCount = document.getElementById('charCount');
textarea.addEventListener('input', function() {
    var len = this.value.length;
    if (len > 0) {
        charCount.textContent = len + '/500';
        charCount.className = 'char-count' + (len > 480 ? (len > 500 ? ' over' : ' warn') : '');
    } else {
        charCount.textContent = '';
    }
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
});

function previewMedia(input, type) {
    var preview = document.getElementById('composePreview');
    if (input.files && input.files[0]) {
        var url = URL.createObjectURL(input.files[0]);
        if (type === 'image') {
            preview.innerHTML = '<img src="' + url + '"><button class="remove-media" type="button" onclick="removeMedia()">&times;</button>';
            document.getElementById('composeVideo').value = '';
        } else {
            preview.innerHTML = '<video src="' + url + '" controls></video><button class="remove-media" type="button" onclick="removeMedia()">&times;</button>';
            document.getElementById('composeImage').value = '';
        }
        preview.style.display = 'block';
    }
}
function removeMedia() {
    document.getElementById('composePreview').style.display = 'none';
    document.getElementById('composePreview').innerHTML = '';
    document.getElementById('composeImage').value = '';
    document.getElementById('composeVideo').value = '';
}

function insertHashtag(inputId) {
    var el = document.getElementById(inputId);
    if (!el) return;
    var pos = el.selectionStart || el.value.length;
    var before = el.value.substring(0, pos);
    var after = el.value.substring(pos);
    var prefix = (before.length > 0 && before[before.length - 1] !== ' ' && before[before.length - 1] !== '\n') ? ' #' : '#';
    el.value = before + prefix + after;
    el.selectionStart = el.selectionEnd = pos + prefix.length;
    el.focus();
    el.dispatchEvent(new Event('input'));
}

var slot = document.getElementById('createPostEmojiPicker');
if (slot) slot.appendChild(createEmojiPicker('createPostText'));
</script>
{% endblock %}
