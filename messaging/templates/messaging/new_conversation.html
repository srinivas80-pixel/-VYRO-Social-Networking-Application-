{% extends 'base.html' %}
{% block title %}New Message - VYRO{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-row">
        <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z"/></svg>
        </button>
        <h1>New message</h1>
    </div>
</div>

<div style="padding:12px 16px;border-bottom:1px solid var(--border);">
    <form method="POST" style="display:flex;gap:8px;">
        {% csrf_token %}
        <div class="search-box" style="flex:1;margin:0;">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.795 0 3.419-.726 4.596-1.904 1.178-1.177 1.904-2.801 1.904-4.596 0-3.59-2.91-6.5-6.5-6.5zm-8.5 6.5c0-4.694 3.806-8.5 8.5-8.5s8.5 3.806 8.5 8.5c0 1.986-.682 3.815-1.824 5.262l4.781 4.781-1.414 1.414-4.781-4.781c-1.447 1.142-3.276 1.824-5.262 1.824-4.694 0-8.5-3.806-8.5-8.5z"/></svg>
            <input type="text" name="username" placeholder="Search people by username" autofocus required>
        </div>
        <button type="submit" class="compose-submit">Start</button>
    </form>
</div>

<div>
    {% for u in users %}
    <a href="{% url 'start_conversation' u.id %}" class="follow-item" style="border-bottom:1px solid var(--border);text-decoration:none;color:var(--text-primary);display:flex;">
        {% if u.profile_picture %}
            <img src="{{ u.profile_picture.url }}" alt="">
        {% else %}
            <div class="avatar-placeholder">{{ u.username.0|upper }}</div>
        {% endif %}
        <div class="follow-info">
            <span class="follow-name">{{ u.get_display_name }}</span>
            <span class="follow-handle">@{{ u.username }}</span>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
