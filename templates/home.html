{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VYRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#0a0e1a;color:#f1f5f9;font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;position:relative}
        body::before{content:'';position:fixed;inset:0;background:url("{% static 'images/register-bg.jpeg' %}") center/cover no-repeat;z-index:-2}
        body::after{content:'';position:fixed;inset:0;background:rgba(10,14,26,0.8);z-index:-1}
        .landing{text-align:center;padding:48px 24px}
        .logo{width:100px;height:100px;border-radius:50%;overflow:hidden;margin:0 auto 32px;box-shadow:0 0 40px rgba(59,130,246,.3)}
        .logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
        h1{font-size:64px;font-weight:700;background:linear-gradient(135deg,#3b82f6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
        p{color:#64748b;font-size:20px;margin-bottom:48px}
        .cta-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
        .cta-btn{padding:16px 32px;border-radius:30px;font-size:17px;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s;display:inline-block}
        .cta-primary{background:#3b82f6;color:#fff;border:none;box-shadow:0 0 20px rgba(59,130,246,.25)}
        .cta-primary:hover{background:#2563eb;text-decoration:none;color:#fff;box-shadow:0 0 30px rgba(59,130,246,.4)}
        .cta-secondary{background:transparent;color:#3b82f6;border:1px solid #1e293b}
        .cta-secondary:hover{background:rgba(59,130,246,.1);text-decoration:none}
    </style>
</head>
<body>
    <div class="landing">
        <div class="logo"><img src="{% static 'images/vyro-logo.jpeg' %}" alt="VYRO"></div>
        <h1>VYRO</h1>
        <p>Your voice, your world.</p>
        <div class="cta-btns">
            <a href="{% url 'register' %}" class="cta-btn cta-primary">Create account</a>
            <a href="{% url 'login' %}" class="cta-btn cta-secondary">Sign in</a>
        </div>
    </div>
</body>
</html>
